<div style="font-family:Arial,sans-serif;max-width:520px;margin:auto;color:#2A1A14">
  <h2 style="color:#561020">Reset your password</h2>
  <p>Hello {{name}},</p>
  <p>We received a request to reset your password.</p>
  <p><a href="{{link}}" style="background:#6B1424;color:#fff;padding:12px 22px;border-radius:6px;text-decoration:none">Choose a new password</a></p>
  <p style="font-size:13px">This link works for 1 hour. If you did not ask for this, ignore this email; your password stays the same.</p>
</div>
